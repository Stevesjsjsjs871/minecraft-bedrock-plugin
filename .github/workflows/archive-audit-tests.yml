name: Archive audit tests

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/archive-audit-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/archive-audit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit tools
        run: python -m py_compile tools/audit_bedrock_archive.py tools/audit_bedrock_references.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
