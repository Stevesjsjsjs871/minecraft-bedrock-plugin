name: Build pinned Mojang Preview sample index

on:
  push:
    branches:
      - feature/mojang-samples-preview-index-20261030
    paths:
      - .github/workflows/build-mojang-samples-preview-index.yml
      - server/mcp_server.py
      - server/tests/test_mcp_server.py
      - skills/bedrock-development/scripts/index_mojang_samples.py
      - skills/bedrock-development/scripts/test_index_mojang_samples.py
      - skills/package-integrity/scripts/check_package_integrity.py
      - skills/package-integrity/scripts/test_check_package_integrity.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mojang-samples-preview-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref_name == 'feature/mojang-samples-preview-index-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Verify official release, full asset and tag commit metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "minecraft-bedrock-engineer-index-builder",
          }

          def get_json(url):
              request = Request(url, headers=headers)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          tag = "v1.26.60.30-preview"
          expected_commit = "4d30ae63750467771b6eccda105f732c6cb77ff7"
          expected_published_at = "2026-10-26T06:24:22Z"
          expected_asset = {
              "id": 677229806,
              "name": "bedrock-samples-v1.26.60.30-preview-full.zip",
              "size": 169961030,
              "digest": "sha256:b7e66ccb64370d345d898ac92cf5a524866657d5aad6ff2655ce1dc6a8d102b9",
          }
          release = get_json(f"https://api.github.com/repos/Mojang/bedrock-samples/releases/tags/{tag}")
          if release.get("tag_name") != tag or release.get("draft") is not False or release.get("prerelease") is not True:
              raise SystemExit("Official GitHub release tag/channel metadata mismatch")
          if release.get("published_at") != expected_published_at or release.get("target_commitish") != "preview":
              raise SystemExit("Official Preview release publication/ref metadata mismatch")
          asset = next((item for item in release.get("assets", []) if item.get("id") == expected_asset["id"]), None)
          if asset is None:
              raise SystemExit("Pinned official Preview full asset ID is missing")
          for key, value in expected_asset.items():
              if asset.get(key) != value:
                  raise SystemExit(f"Official Preview asset metadata mismatch for {key}: {asset.get(key)!r}")
          commit = get_json(f"https://api.github.com/repos/Mojang/bedrock-samples/commits/{tag}")
          if commit.get("sha") != expected_commit:
              raise SystemExit(f"Preview tag commit mismatch: {commit.get('sha')}")
          print(json.dumps({
              "status": "PASS",
              "release_id": release.get("id"),
              "tag": tag,
              "published_at": release.get("published_at"),
              "prerelease": release.get("prerelease"),
              "asset_id": asset.get("id"),
              "asset_name": asset.get("name"),
              "asset_size": asset.get("size"),
              "asset_digest": asset.get("digest"),
              "tag_commit": commit.get("sha"),
              "commit_signature_verified": commit.get("commit", {}).get("verification", {}).get("verified"),
          }, indent=2))
          PY

      - name: Download pinned full Preview asset
        id: download
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/mbe-workspace"
          mkdir -p "$workspace"
          archive="$workspace/bedrock-samples-v1.26.60.30-preview-full.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/Mojang/bedrock-samples/releases/download/v1.26.60.30-preview/bedrock-samples-v1.26.60.30-preview-full.zip"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify full asset bytes and every ZIP member CRC
        env:
          ARCHIVE: ${{ steps.download.outputs.archive }}
        run: |
          set -euo pipefail
          test "$(stat -c%s "$ARCHIVE")" = "169961030"
          echo "b7e66ccb64370d345d898ac92cf5a524866657d5aad6ff2655ce1dc6a8d102b9  $ARCHIVE" | sha256sum --check -
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          path = Path(os.environ["ARCHIVE"])
          with zipfile.ZipFile(path) as archive:
              infos = archive.infolist()
              total = sum(info.file_size for info in infos if not info.is_dir())
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f"ZIP CRC failure: {bad_member}")
          print(f"PASS: {len(infos)} ZIP entries; {total} declared uncompressed bytes; all member CRCs valid")
          PY

      - name: Generate the separate Preview metadata-only index
        env:
          ARCHIVE: ${{ steps.download.outputs.archive }}
        run: |
          set -euo pipefail
          base="skills/bedrock-development/references/mojang-samples-1.26.60.30-preview"
          mkdir -p "$base"
          python skills/bedrock-development/scripts/index_mojang_samples.py \
            "$ARCHIVE" \
            --output "$base/mojang-samples-index.json.gz" \
            --target-version "1.26.60.30-preview"

      - name: Verify Preview corpus and write provenance metadata
        env:
          ARCHIVE: ${{ steps.download.outputs.archive }}
        run: |
          python - <<'PY'
          from collections import Counter
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import zipfile

          version = "1.26.60.30-preview"
          archive_path = Path(os.environ["ARCHIVE"])
          base = Path("skills/bedrock-development/references") / f"mojang-samples-{version}"
          index_path = base / "mojang-samples-index.json.gz"
          metadata_path = base / "INDEX_METADATA.json"
          with gzip.open(index_path, "rt", encoding="utf-8") as stream:
              index = json.load(stream)
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              entry_count = len(infos)
              uncompressed_bytes = sum(info.file_size for info in infos if not info.is_dir())

          expected_sha = "b7e66ccb64370d345d898ac92cf5a524866657d5aad6ff2655ce1dc6a8d102b9"
          expected_name = "bedrock-samples-v1.26.60.30-preview-full.zip"
          if index.get("target_version") != version:
              raise SystemExit("Preview index target_version mismatch")
          if index.get("archive_sha256") != expected_sha:
              raise SystemExit("Preview index source archive SHA-256 mismatch")
          if index.get("archive_file_name") != expected_name:
              raise SystemExit("Preview index source archive filename mismatch")
          if index.get("schema_version") != 1 or index.get("dataset_id") != "mojang-bedrock-samples":
              raise SystemExit("Preview index schema/dataset mismatch")
          stats = index.get("archive_stats", {})
          if stats.get("entry_count") != entry_count or stats.get("declared_uncompressed_bytes") != uncompressed_bytes:
              raise SystemExit("Preview index ZIP statistics mismatch")
          if stats.get("indexed_count") != len(index.get("entries", [])):
              raise SystemExit("Preview indexed_count mismatch")
          policy = index.get("index_policy", {})
          if any(policy.get(flag) is not True for flag in ("no_extraction", "no_execution", "no_network")):
              raise SystemExit("Preview index policy must disable extraction, execution and network")
          categories = dict(sorted(Counter(item["category"] for item in index["entries"]).items()))
          index_bytes = index_path.read_bytes()
          metadata = {
              "source_archive": expected_name,
              "source_url": "https://github.com/Mojang/bedrock-samples",
              "target_version": version,
              "zip_sha256": expected_sha,
              "entry_count": entry_count,
              "indexed_count": stats["indexed_count"],
              "declared_uncompressed_bytes": uncompressed_bytes,
              "category_counts": categories,
              "license_notice": "(c) Mojang AB. All rights reserved. By downloading the files in this repository, you agree to the Minecraft End User License Agreement and that these files are subject to its terms.",
              "method": "CI verifies the pinned official Preview release API metadata, tag commit, full asset SHA-256/size and complete ZIP CRC table, then builds a metadata-only no-extraction/no-execution index.",
              "source_release_tag": "v1.26.60.30-preview",
              "source_release_url": "https://github.com/Mojang/bedrock-samples/releases/tag/v1.26.60.30-preview",
              "source_release_published_at": "2026-10-26T06:24:22Z",
              "source_release_commit": "4d30ae63750467771b6eccda105f732c6cb77ff7",
              "source_commit_signature_verified": False,
              "source_asset_id": 677229806,
              "source_asset_size_bytes": 169961030,
              "source_asset_sha256": expected_sha,
              "index_file": index_path.name,
              "index_sha256": hashlib.sha256(index_bytes).hexdigest(),
              "index_size_bytes": len(index_bytes),
              "index_generator": "skills/bedrock-development/scripts/index_mojang_samples.py",
              "index_generation_python": platform.python_version(),
          }
          metadata_path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "status": "PASS",
              "target_version": version,
              "entry_count": entry_count,
              "indexed_count": stats["indexed_count"],
              "declared_uncompressed_bytes": uncompressed_bytes,
              "category_counts": categories,
              "index_sha256": metadata["index_sha256"],
              "index_size_bytes": metadata["index_size_bytes"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Compile Python sources
        run: |
          python -m py_compile server/mcp_server.py server/tests/test_mcp_server.py
          python -m py_compile skills/bedrock-development/scripts/index_mojang_samples.py skills/bedrock-development/scripts/test_index_mojang_samples.py
          python -m py_compile skills/package-integrity/scripts/check_package_integrity.py skills/package-integrity/scripts/test_check_package_integrity.py
          python -m py_compile skills/audit-benchmark/scripts/evaluate_benchmark.py
          python -m py_compile skills/automated-validation/scripts/bedrock_audit.py skills/automated-validation/scripts/validate_report.py
          python -m py_compile skills/regression-evals/scripts/regression_tests.py
          python -m py_compile skills/visual-resource-pipeline/scripts/generate_texture.py skills/visual-resource-pipeline/scripts/test_generate_texture.py

      - name: Install report-schema validator
        run: python -m pip install jsonschema

      - name: Run complete unit suites with the real Preview source archive
        env:
          MOJANG_PREVIEW_ARCHIVE: ${{ steps.download.outputs.archive }}
        run: |
          python -m unittest discover -s server/tests -v
          python -m unittest discover -s skills/audit-benchmark/scripts -p 'test_*.py' -v
          python -m unittest discover -s skills/bedrock-development/scripts -p 'test_*.py' -v
          python -m unittest discover -s skills/visual-resource-pipeline/scripts -p 'test_*.py' -v
          python -m unittest discover -s skills/package-integrity/scripts -p 'test_*.py' -v

      - name: Run deep package-integrity audit
        run: python skills/package-integrity/scripts/check_package_integrity.py .

      - name: Run analyzer regression and report-schema checks
        run: python skills/regression-evals/scripts/regression_tests.py --auditor skills/automated-validation/scripts/bedrock_audit.py

      - name: Verify identity, prompts, MCP configuration and both corpora
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          import runpy

          expected = "1.0.11"
          assert Path("VERSION").read_text(encoding="utf-8").strip() == expected
          root = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          compat = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert root["name"] == compat["name"] == "minecraft-bedrock-engineer"
          assert root["version"] == compat["version"] == expected
          prompts = root["extensions"]["com.openai"]["interface"]["defaultPrompt"]
          assert prompts == compat["interface"]["defaultPrompt"] and len(prompts) == 3
          server = runpy.run_path("server/mcp_server.py")
          assert server["DEFAULT_MOJANG_SAMPLE_VERSION"] == "1.26.50.4"
          assert server["MOJANG_SAMPLE_CORPORA"]["1.26.60.30-preview"]["channel"] == "preview"
          assert server["MOJANG_SAMPLE_SOURCE_CATALOG"]["1.26.60.30-preview"]["indexed"] is True
          preview_index = Path("skills/bedrock-development/references/mojang-samples-1.26.60.30-preview/mojang-samples-index.json.gz")
          with gzip.open(preview_index, "rt", encoding="utf-8") as stream:
              payload = json.load(stream)
          assert payload["target_version"] == "1.26.60.30-preview"
          for config_path in (".mcp.json", "mcp.json"):
              config = json.loads(Path(config_path).read_text(encoding="utf-8"))
              assert config["mcpServers"]["minecraft-bedrock-engineer"]["type"] == "stdio"
          print("PASS: identity, 3 original prompts, stdio MCP config, stable default and distinct indexed Preview corpus")
          PY

      - name: Commit only the verified Preview index and metadata
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" != "feature/mojang-samples-preview-index-20261030" ]]; then
            echo "Refusing to write generated Preview data to unexpected branch: $TARGET_BRANCH"
            exit 1
          fi
          git diff --check
          git add skills/bedrock-development/references/mojang-samples-1.26.60.30-preview/mojang-samples-index.json.gz
          git add skills/bedrock-development/references/mojang-samples-1.26.60.30-preview/INDEX_METADATA.json
          if git diff --cached --quiet; then
            echo "Verified Preview index and metadata are already current; no data commit required." >> "$GITHUB_STEP_SUMMARY"
          else
            changed="$(git diff --cached --name-only)"
            expected=$'skills/bedrock-development/references/mojang-samples-1.26.60.30-preview/INDEX_METADATA.json\nskills/bedrock-development/references/mojang-samples-1.26.60.30-preview/mojang-samples-index.json.gz'
            if [[ "$changed" != "$expected" ]]; then
              echo "Unexpected generated-file set: $changed"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: add verified Mojang samples index 1.26.60.30-preview"
            git push origin "HEAD:$TARGET_BRANCH"
            echo "Committed verified Preview index at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi
