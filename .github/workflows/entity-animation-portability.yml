name: Validate entity and animation MCP portability

on:
  pull_request:
    paths:
      - "server/entity_authoring_mcp.py"
      - "server/animation_controller_mcp.py"
      - "server/tests/test_entity_authoring_mcp.py"
      - "server/tests/test_animation_controller_mcp.py"
      - "server/tests/test_mcp_registry.py"
      - "mcp.json"
      - ".mcp.json"
      - "VERSION"
      - ".github/workflows/entity-animation-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-tests:
    name: Authoring tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test custom entity authoring
        run: python -m unittest discover -s server/tests -p "test_entity_authoring_mcp.py" -v
      - name: Test animation controller authoring
        run: python -m unittest discover -s server/tests -p "test_animation_controller_mcp.py" -v
      - name: Test five-server MCP registry
        run: python -m unittest discover -s server/tests -p "test_mcp_registry.py" -v
