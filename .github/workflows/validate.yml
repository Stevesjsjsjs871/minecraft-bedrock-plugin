name: Validate Minecraft Bedrock Engineer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report-schema validator
        run: python -m pip install jsonschema
      - name: Compile analyzer, MCP server and evaluation tools
        run: |
          python -m py_compile archive_safety.py
          python -m py_compile server/mcp_server.py server/tests/test_mcp_server.py
          python -m py_compile skills/automated-validation/scripts/bedrock_audit.py
          python -m py_compile skills/automated-validation/scripts/validate_report.py
          python -m py_compile skills/regression-evals/scripts/regression_tests.py
          python -m py_compile skills/audit-benchmark/scripts/evaluate_benchmark.py
          python -m py_compile skills/audit-benchmark/scripts/test_evaluate_benchmark.py
      - name: Test MCP server schemas, protocol, diff tool and safety
        run: python -m unittest discover -s server/tests -v
      - name: Test benchmark evaluator safety and metrics
        run: python -m unittest discover -s skills/audit-benchmark/scripts -p 'test_*.py' -v
      - name: Run analyzer regression cases and report-schema checks
        run: python skills/regression-evals/scripts/regression_tests.py --auditor skills/automated-validation/scripts/bedrock_audit.py
      - name: Check package, compatibility manifest and server versions
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          expected = "0.9.0"
          assert Path("VERSION").read_text(encoding="utf-8").strip() == expected
          root = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          compat = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert root["name"] == compat["name"] == "minecraft-bedrock-engineer"
          assert root["version"] == compat["version"] == expected
          assert root["extensions"]["com.openai"]["interface"]["defaultPrompt"] == compat["interface"]["defaultPrompt"]
          server = runpy.run_path("server/mcp_server.py")
          assert server["SERVER_VERSION"] == expected
          print("PASS: package, manifests, prompts and MCP server are synchronized at", expected)
          PY
