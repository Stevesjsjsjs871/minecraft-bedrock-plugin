name: Validate Minecraft Bedrock Engineer

on:
  push:
    branches: ["feat/cloudflare-workers-mcp"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Assert exact Python runtime
        run: |
          python - <<'PY'
          import sys
          expected = (3, 12, 16)
          actual = sys.version_info[:3]
          if actual != expected:
              raise SystemExit(f"Expected Python {expected}, got {actual}")
          print(f"PASS: Python {sys.version.split()[0]}")
          PY
      - name: Compile bundled Python utilities
        run: python -m compileall -q skills server
      - name: Local MCP server protocol, authoring and safety tests
        run: python -m unittest discover -s server/tests -p 'test_*.py' -v
      - name: Remote Cloudflare Worker capability contract tests
        run: python -m unittest discover -s cloudflare/tests -p 'test_*.py' -v
      - name: Geometry and UV engine tests
        run: python -m unittest discover -s skills/geometry-uv-engine/scripts -p 'test_*.py' -v
      - name: PNG engine and texture generator tests
        run: python -m unittest discover -s skills/visual-resource-pipeline/scripts -p 'test_*.py' -v
      - name: Package integrity and provenance tests
        run: python -m unittest discover -s skills/package-integrity/scripts -p 'test_*.py' -v
      - name: Mojang sample indexer and restore tests
        run: python -m unittest discover -s skills/bedrock-development/scripts -p 'test_*.py' -v
      - name: Install audit benchmark schema dependency
        run: python -m pip install --disable-pip-version-check -r skills/audit-benchmark/requirements.txt
      - name: Audit benchmark tests
        run: python -m unittest discover -s skills/audit-benchmark/scripts -p 'test_*.py' -v
      - name: Verify release metadata and MCP registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "1.5.13"
          assert Path("VERSION").read_text().strip() == expected
          root = json.loads(Path("plugin.json").read_text())
          compat = json.loads(Path(".codex-plugin/plugin.json").read_text())
          assert root["name"] == compat["name"] == "minecraft-bedrock-engineer"
          assert root["version"] == compat["version"] == expected
          assert root["extensions"]["com.openai"]["interface"]["defaultPrompt"] == compat["interface"]["defaultPrompt"]
          assert Path("mcp.json").is_file() and Path(".mcp.json").is_file()
          assert len(json.loads(Path("mcp.json").read_text())["mcpServers"]) == 16
          assert compat.get("mcpServers") == "./.mcp.json"
          assert Path("cloudflare/src/index.ts").is_file() and Path("wrangler.toml").is_file()
          assert not Path("Dockerfile").exists() and not Path("cloudflare/container").exists()
          print("PASS: manifests, prompts, 16 local MCP servers, Creator Tools and Worker source", expected)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Type-check Cloudflare Worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run typecheck
      - name: Download and verify exact Mojang Bedrock Samples v1.26.50.4 release
        env:
          MOJANG_SAMPLES_URL: https://github.com/Mojang/bedrock-samples/releases/download/v1.26.50.4/bedrock-samples-v1.26.50.4-full.zip
          MOJANG_SAMPLES_SHA256: c0b6151f5f9a0c31ebe3c909dfc82d97f12473ed2c6e039aa7e22d667042026c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bedrock-samples-v1.26.50.4-full.zip"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 "$MOJANG_SAMPLES_URL" -o "$archive"
          echo "$MOJANG_SAMPLES_SHA256  $archive" | sha256sum --check -
          python skills/bedrock-development/scripts/restore_mojang_index.py "$archive" \
            --metadata skills/bedrock-development/references/mojang-samples-1.26.50.4/INDEX_METADATA.json \
            --indexer skills/bedrock-development/scripts/index_mojang_samples.py \
            --output "$RUNNER_TEMP/mojang-samples-index.json.gz"
      - name: Build and verify complete extracted plugin candidate
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/mbe-source"
          extract_dir="$RUNNER_TEMP/mbe-extracted"
          version="$(cat VERSION)"
          candidate="$RUNNER_TEMP/minecraft-bedrock-engineer-$version.tar.gz"
          rm -rf "$source_dir" "$extract_dir" "$candidate" "$candidate.sha256"
          mkdir -p "$source_dir" "$extract_dir"
          git archive "$GITHUB_SHA" | tar -x -C "$source_dir"
          cp "$RUNNER_TEMP/mojang-samples-index.json.gz" \
            "$source_dir/skills/bedrock-development/references/mojang-samples-1.26.50.4/mojang-samples-index.json.gz"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python "$source_dir/skills/package-integrity/scripts/build_skills_package.py" \
            "$source_dir" "$candidate" \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$epoch" \
            --source-ref "$GITHUB_REF"
          tar -xzf "$candidate" -C "$extract_dir"
          python "$extract_dir/skills/package-integrity/scripts/check_skills_package.py" "$extract_dir"
          (cd "$RUNNER_TEMP" && sha256sum --check "$(basename "$candidate").sha256")

      - name: Rebuild from an independent clean snapshot and compare archive bytes
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          first="$RUNNER_TEMP/minecraft-bedrock-engineer-$version.tar.gz"
          repro_source="$RUNNER_TEMP/mbe-source-repro"
          repro_output="$RUNNER_TEMP/mbe-output-repro"
          second="$repro_output/minecraft-bedrock-engineer-$version.tar.gz"
          rm -rf "$repro_source" "$repro_output"
          mkdir -p "$repro_source" "$repro_output"
          git archive "$GITHUB_SHA" | tar -x -C "$repro_source"
          cp "$RUNNER_TEMP/mojang-samples-index.json.gz" \
            "$repro_source/skills/bedrock-development/references/mojang-samples-1.26.50.4/mojang-samples-index.json.gz"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python "$repro_source/skills/package-integrity/scripts/build_skills_package.py" \
            "$repro_source" "$second" \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$epoch" \
            --source-ref "$GITHUB_REF"
          cmp --silent "$first" "$second"
          cmp --silent "$first.sha256" "$second.sha256"
          sha256sum "$first" "$second"
          echo "PASS: independent clean snapshots produced byte-identical tar.gz archives and SHA-256 sidecars"
