name: Validate Minecraft Bedrock Engineer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report-schema validator
        run: python -m pip install jsonschema
      - name: Compile analyzer, MCP servers and evaluation tools
        run: |
          python -m py_compile archive_safety.py
          python -m py_compile server/mcp_server.py server/tests/test_mcp_server.py
          python -m py_compile server/texture_generator_mcp.py server/tests/test_texture_generator_mcp.py
          python -m py_compile server/png_validation.py server/tests/test_png_validation.py
          python -m py_compile server/texture_link_audit_mcp.py server/tests/test_texture_link_audit_mcp.py
          python -m py_compile server/entity_authoring_mcp.py server/tests/test_entity_authoring_mcp.py
          python -m py_compile server/animation_controller_mcp.py server/tests/test_animation_controller_mcp.py
          python -m py_compile skills/automated-validation/scripts/bedrock_audit.py
          python -m py_compile skills/automated-validation/scripts/validate_report.py
          python -m py_compile skills/regression-evals/scripts/regression_tests.py
          python -m py_compile skills/audit-benchmark/scripts/evaluate_benchmark.py
          python -m py_compile skills/audit-benchmark/scripts/test_evaluate_benchmark.py
          python -m py_compile skills/bedrock-development/scripts/index_mojang_samples.py
          python -m py_compile skills/bedrock-development/scripts/test_index_mojang_samples.py
          python -m py_compile skills/package-integrity/scripts/check_package_integrity.py
          python -m py_compile skills/package-integrity/scripts/test_check_package_integrity.py
          python -m py_compile skills/visual-resource-pipeline/scripts/generate_texture.py skills/visual-resource-pipeline/scripts/test_generate_texture.py
      - name: Test MCP server schemas, protocol, diff tool and safety
        run: python -m unittest discover -s server/tests -v
      - name: Test shared PNG stream validator
        run: python -m unittest discover -s server/tests -p 'test_png_validation.py' -v
      - name: Test read-only BP/RP texture-link auditor
        run: python -m unittest discover -s server/tests -p 'test_texture_link_audit_mcp.py' -v
      - name: Test benchmark evaluator safety and metrics
        run: python -m unittest discover -s skills/audit-benchmark/scripts -p 'test_*.py' -v
      - name: Test Mojang sample-index safety and fallback
        run: python -m unittest discover -s skills/bedrock-development/scripts -p 'test_*.py' -v
      - name: Test procedural texture generator
        run: python -m unittest discover -s skills/visual-resource-pipeline/scripts -p 'test_*.py' -v
      - name: Test package-integrity checker
        run: python -m unittest discover -s skills/package-integrity/scripts -p 'test_*.py' -v
      - name: Run package-integrity audit
        run: python skills/package-integrity/scripts/check_package_integrity.py .
      - name: Run analyzer regression cases and report-schema checks
        run: python skills/regression-evals/scripts/regression_tests.py --auditor skills/automated-validation/scripts/bedrock_audit.py
      - name: Check package, compatibility manifest and server versions
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          expected = "1.1.1"
          assert Path("VERSION").read_text(encoding="utf-8").strip() == expected
          root = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          compat = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert root["name"] == compat["name"] == "minecraft-bedrock-engineer"
          assert root["version"] == compat["version"] == expected
          assert root["extensions"]["com.openai"]["interface"]["defaultPrompt"] == compat["interface"]["defaultPrompt"]
          server = runpy.run_path("server/mcp_server.py")
          texture_server = runpy.run_path("server/texture_generator_mcp.py")
          texture_auditor = runpy.run_path("server/texture_link_audit_mcp.py")
          entity_server = runpy.run_path("server/entity_authoring_mcp.py")
          animation_server = runpy.run_path("server/animation_controller_mcp.py")
          assert server["SERVER_VERSION"] == expected
          assert texture_server["SERVER_VERSION"] == expected
          assert texture_auditor["SERVER_VERSION"] == expected
          assert entity_server["SERVER_VERSION"] == expected
          assert animation_server["SERVER_VERSION"] == expected
          entity_tools = {tool["name"]: tool for tool in entity_server["TOOLS"]}
          assert "create_addon_entity_with_geometry" in entity_tools
          assert entity_tools["create_addon_entity_with_geometry"]["annotations"]["readOnlyHint"] is False
          core_tools = {tool["name"]: tool for tool in server["TOOLS"]}
          assert "create_addon_entity" in core_tools
          assert {"creator_tools_status", "creator_tools_catalog", "validate_with_mct", "create_entity_with_mct"} <= set(core_tools)
          animation_tools = {tool["name"]: tool for tool in animation_server["TOOLS"]}
          assert {"create_animation_controller", "validate_animation_controller"} <= set(animation_tools)
          assert animation_tools["validate_animation_controller"]["annotations"]["readOnlyHint"] is True
          texture_tools = {tool["name"]: tool for tool in texture_server["TOOLS"]}
          assert {"generate_texture", "register_texture_atlas"} <= set(texture_tools)
          assert texture_tools["register_texture_atlas"]["annotations"]["idempotentHint"] is True
          audit_tools = {tool["name"]: tool for tool in texture_auditor["TOOLS"]}
          assert "audit_texture_links" in audit_tools
          assert audit_tools["audit_texture_links"]["annotations"]["readOnlyHint"] is True
          for config_path in (".mcp.json", "mcp.json"):
              config = json.loads(Path(config_path).read_text(encoding="utf-8"))
              servers = config.get("mcpServers", {})
              texture = servers.get("minecraft-bedrock-texture-generator")
              audit = servers.get("minecraft-bedrock-texture-link-auditor")
              entity = servers.get("minecraft-bedrock-entity-authoring")
              animation = servers.get("minecraft-bedrock-animation-controller-authoring")
              assert texture and texture.get("type") == "stdio"
              assert any("server/texture_generator_mcp.py" in arg.replace("\\", "/") for arg in texture.get("args", []))
              assert audit and audit.get("type") == "stdio"
              assert any("server/texture_link_audit_mcp.py" in arg.replace("\\", "/") for arg in audit.get("args", []))
              assert entity and entity.get("type") == "stdio"
              assert any("server/entity_authoring_mcp.py" in arg.replace("\\", "/") for arg in entity.get("args", []))
              assert animation and animation.get("type") == "stdio"
              assert any("server/animation_controller_mcp.py" in arg.replace("\\", "/") for arg in animation.get("args", []))
          print("PASS: manifests, prompts, entity/animation authoring, texture authoring/audit and five MCP servers are synchronized at", expected)
          PY

  entity-animation-portability:
    name: Authoring tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test custom entity authoring
        run: python -m unittest discover -s server/tests -p "test_entity_authoring_mcp.py" -v
      - name: Test animation controller authoring
        run: python -m unittest discover -s server/tests -p "test_animation_controller_mcp.py" -v
      - name: Test five-server MCP registry
        run: python -m unittest discover -s server/tests -p "test_mcp_registry.py" -v
